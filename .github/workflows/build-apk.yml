name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk-headless \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev automake

      - name: 缓存 Buildozer 与 Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: 安装 Buildozer 与 Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36 virtualenv

      - name: 运行核心逻辑测试
        run: |
          python -m pip install requests pillow
          python tests/run_tests.py

      - name: 运行 UI 交互测试（虚拟显示）
        run: |
          sudo apt-get install -y -q libsdl2-2.0-0 libgl1 libglib2.0-0 xvfb
          python -m pip install kivy plyer
          xvfb-run -a -s "-screen 0 500x900x24" python tests/test_ui_flow.py

      - name: 构建 APK（debug，可直接安装）
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          buildozer -v android debug
        continue-on-error: false

      - name: 上传 APK 为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: myledger-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
